services:
  roundchat:
    image: ghcr.io/tayyebi/roundchat:latest
    ports:
      - "3000:3000"
    environment:
      ROUNDCHAT_HOST: "0.0.0.0"
      ROUNDCHAT_PORT: "3000"
    env_file:
      - .env
    volumes:
      - roundchat-data:/data/roundchat
    restart: unless-stopped
    networks:
      - mailserver_shared

networks:
  mailserver_shared:
    external: true

volumes:
  roundchat-data:
